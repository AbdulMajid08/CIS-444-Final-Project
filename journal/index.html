<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Entry Page</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <div id="page">
            <button type="button" onclick="window.location.href='../dashboard/index.html'">← Back to Dashboard</button>
            <h1 id="page-heading">New Entry</h1>

            <label class="field-label" for="entry-title">Title</label>
            <input type="text" id="entry-title" maxlength="200" placeholder="Give your entry a title" autocomplete="off" />

            <label class="field-label" for="writing">Write</label>
            <textarea id="writing" placeholder="Write your thoughts here…"></textarea>

            <div class="journal-actions">
                <button type="button" id="save-btn" class="save-btn">Save entry</button>
            </div>
        </div>
    </header>

    <script type="module" src="./script.js"></script>
</body>
</html>
