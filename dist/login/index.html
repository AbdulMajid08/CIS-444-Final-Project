<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MoodJournal – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet"/>
  <script type="module" crossorigin src="/assets/login-RpHeci7a.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/api-harsJktA.js">
  <link rel="stylesheet" crossorigin href="/assets/login-C-5iXZoE.css">
</head>
<body>

  
  <div class="center">
    <div class="card">

      
      <div class="brand">
        <span>🌿</span>
        <span>MoodJournal</span>
      </div>

      <!-- login form html -->
      <div id="loginForm">
        <h2>Sign In</h2>
        <p class="subtitle">Welcome back — let's check in.</p>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" />
        </div>

        <button type="button" class="forgot-link" onclick="showForgot()">Forgot password?</button>

        <p class="error-msg" id="errorMsg"></p>

        <button class="btn" onclick="LoginHandler()">Sign In</button>

        <div class="divider"></div>

        <button class="btn-ghost" onclick="showSignup()">Don't have an account? Sign up</button>
      </div>

      <div id="forgotForm" class="hidden">
        <h2>Reset password</h2>
        <p class="subtitle">Enter your email and we'll send you a link.</p>

        <div class="input-group">
          <label for="resetEmail">Email</label>
          <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email" />
        </div>

        <p class="error-msg" id="forgotErrorMsg"></p>
        <p class="success-msg hidden" id="forgotSuccessMsg" role="status"></p>

        <button class="btn" type="button" onclick="ForgotPasswordHandler()">Send reset link</button>

        <div class="divider"></div>

        <button class="btn-ghost" type="button" onclick="showLogin()">Back to sign in</button>
      </div>

      <!-- this the signup form but has to be hidden by default to follow normal website architecture -->
      <div id="signupForm" class="hidden">
        <h2>Create Account</h2>
        <p class="subtitle">Start your journaling journey.</p>

        <div class="input-group">
          <label for="newName">Full Name</label>
          <input type="text" id="newName" placeholder="Your name" />
        </div>

        <div class="input-group">
          <label for="newEmail">Email</label>
          <input type="email" id="newEmail" placeholder="you@example.com" />
        </div>

        <div class="input-group">
          <label for="newPassword">Password</label>
          <input type="password" id="newPassword" placeholder="Min. 6 characters" />
        </div>

        <p class="error-msg" id="signupErrorMsg"></p>

        <button class="btn" onclick="SignupHandler()">Create Account</button>

        <div class="divider"></div>

        <button class="btn-ghost" onclick="showLogin()">Already have an account? Sign in</button>
      </div>

    </div>
  </div>

</body>
</html>
